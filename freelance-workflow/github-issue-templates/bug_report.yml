name: Bug report
description: Report a reproducible issue in the website.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private customer details, or other sensitive information."
  - type: input
    id: page
    attributes:
      label: Page or URL
      description: Where did the issue occur?
      placeholder: https://example.com/page
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe what you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Select …\n3. Observe …"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: "Safari on iPhone, Chrome on Windows, etc."
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or additional context
      description: Remove personal or customer information before attaching screenshots.
    validations:
      required: false
