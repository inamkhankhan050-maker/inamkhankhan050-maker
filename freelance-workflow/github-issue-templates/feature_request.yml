name: Feature request
description: Suggest a scoped improvement to the website.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, private customer details, or other sensitive information."
  - type: textarea
    id: need
    attributes:
      label: What user need does this address?
      description: Describe the visitor or business need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How could we confirm this is complete?
      description: List observable acceptance criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or constraints
    validations:
      required: false
